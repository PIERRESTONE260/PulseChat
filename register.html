<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — PulseChat</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <link rel="apple-touch-icon" href="assets/icons/logo.svg">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </div>
                <h1>Créer un compte</h1>
                <p>Rejoignez PulseChat et discutez instantanément.</p>
            </div>

            <div id="auth-alert" class="alert hidden" role="alert"></div>

            <form id="register-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="reg-fullname">Nom complet</label>
                    <input type="text" id="reg-fullname" name="full_name" placeholder="Ex : Pierre Ngoy" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="reg-username">Nom d'utilisateur unique</label>
                    <div class="input-prefix-wrapper">
                        <span class="input-prefix">@</span>
                        <input type="text" id="reg-username" name="username" placeholder="pierre_ngoy" autocomplete="username" required>
                    </div>
                    <small class="field-hint" id="username-feedback">3 à 24 caractères (lettres minuscules, chiffres, _).</small>
                </div>

                <div class="form-group">
                    <label for="reg-email">Adresse e-mail</label>
                    <input type="email" id="reg-email" name="email" placeholder="exemple@domaine.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="reg-password">Mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" name="password" placeholder="Minimum 6 caractères" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="reg-password" aria-label="Afficher ou masquer">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-confirm-password">Confirmer le mot de passe</label>
                    <div class="password-wrapper">
                        <input type="password" id="reg-confirm-password" name="confirm_password" placeholder="Répétez le mot de passe" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="reg-confirm-password" aria-label="Afficher ou masquer">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="register-submit" class="btn btn-primary btn-block">
                    <span class="btn-text">S'inscrire</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Déjà inscrit ? <a href="login.html">Se connecter</a></p>
            </div>
        </div>
    </main>

    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
